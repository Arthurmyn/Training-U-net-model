# Training / evaluation settings. Dataset paths, preprocessing size and mask threshold come from config.yaml.
audit_config: config.yaml
runs_dir: runs                    # one folder per (source dataset, seed): runs/kvasir_seed1, ...
results_dir: results

sources: [kvasir, cvc]            # train one model family on each of these datasets
seeds: [1, 2, 3]                  # independent runs per source (initialisation, shuffling, augmentation)

model:
  base_channels: 32               # U-Net width: 32 -> ~7.8 M parameters, 64 -> ~31 M

training:
  batch_size: 16
  max_epochs: 100
  patience: 15                    # stop when val Dice has not improved for this many epochs
  lr: 0.001
  weight_decay: 0.0001
  lr_patience: 5                  # halve the learning rate after this many epochs without val improvement
  loss: bce_dice                  # binary cross-entropy + soft Dice
  threshold: 0.5                  # probability threshold used to turn predictions into masks
  device: auto                    # auto | cuda | mps | cpu
  amp: true                       # mixed precision, used on CUDA only
  num_workers: 0                  # 0 is safest on Windows/macOS; raise on Linux for speed
  deterministic: false            # true forces deterministic GPU kernels (slower)

augmentation:                     # geometric, applied to training images only (never val/test)
  hflip: 0.5
  vflip: 0.5
  p_affine: 0.5                   # probability of a random rotation + zoom
  rotation_deg: 15
  scale: [0.9, 1.1]

analysis:
  bootstrap_samples: 10000
  seed: 42
  ci_level: 0.95
  practical_thresholds: [0.05, 0.03, 0.10]   # main threshold first, then sensitivity checks
